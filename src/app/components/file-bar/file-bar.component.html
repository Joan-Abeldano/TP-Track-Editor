<div class="file-bar">
  <div class="brand">
    <img class="brand-mark" src="racing-car.png" alt="" />
    <span class="brand-name">TP Track Editor</span>
  </div>

  <div class="name-field">
    <input
      type="text"
      [value]="trackName()"
      (input)="onNameInput($event)"
      placeholder="track name"
      spellcheck="false"
    />
    <span class="ext">.json</span>
  </div>

  <div class="actions">
    <button class="app-btn" (click)="onNewTrack()" title="New empty track (Ctrl/Cmd+N)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      New
    </button>
    <button class="app-btn" (click)="onImportTrack()" title="Import track JSON (Ctrl/Cmd+O)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Import
    </button>
    <button class="app-btn" (click)="showGenerate.set(true)" title="Generate a new layout from your loaded track corpus">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
      Generate
    </button>
    <button class="app-btn" (click)="onRegenerateBackground()" [disabled]="!hasPoints() || bgBusy()" title="Render a new terrain background for the current track">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      {{ bgBusy() ? 'Rendering…' : 'Regenerate BG' }}
    </button>
    <button class="app-btn" (click)="onLoadBackground()" title="Load PNG background to trace (Ctrl/Cmd+Alt+Shift+O)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      Load BG
    </button>
    @if (backgroundUrl()) {
      <button class="app-btn danger" (click)="clearBackground()" title="Remove background (Ctrl/Cmd+Alt+B)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        Clear BG
      </button>
    }
    <button class="app-btn primary" (click)="onSaveTrack()" [disabled]="!hasPoints()" [title]="backgroundUrl() ? 'Save track and background as a ZIP bundle (Ctrl/Cmd+S)' : 'Save as JSON (Ctrl/Cmd+S)'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      Save
    </button>
  </div>

  <div class="spacer"></div>
</div>

<app-generate-dialog [open]="showGenerate()" (closed)="showGenerate.set(false)"></app-generate-dialog>

@if (showBrandMark) {
  <div class="brand-mark-easter-egg" aria-hidden="true">
    <img src="minji.png" alt="" />
  </div>
}
