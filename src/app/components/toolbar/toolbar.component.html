<div class="toolbar">
  <div class="tool-group">
    @for (t of tools; track t.id) {
      <button
        class="tool-btn"
        [class.active]="activeTool() === t.id"
        [title]="t.desc + (t.key ? '  [' + t.key + ']' : '')"
        (click)="setTool(t.id)"
      >
        <span class="tool-icon" [innerHTML]="iconSvg(t.icon)"></span>
        <span class="tool-label">{{ t.label }}</span>
        @if (t.key) {
          <span class="tool-key">{{ t.key }}</span>
        }
      </button>
    }
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <button class="tool-btn sm" (click)="undo()" [disabled]="!canUndo()" title="Undo (Ctrl/Cmd+Z)">
      <span class="tool-icon" [innerHTML]="iconSvg('undo')"></span>
    </button>
    <button class="tool-btn sm" (click)="redo()" [disabled]="!canRedo()" title="Redo (Ctrl/Cmd+Y or Ctrl/Cmd+Shift+Z)">
      <span class="tool-icon" [innerHTML]="iconSvg('redo')"></span>
    </button>
  </div>
</div>
